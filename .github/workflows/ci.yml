name: Assignment Portal CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        id: pytest
        continue-on-error: true
        run: pytest -v --junitxml=junit.xml

      - name: Create JSON test report
        if: always()
        run: python scripts/create_report.py junit.xml

      - name: Send report to local computer through tunnel
        if: always()
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
          REPORT_RECEIVER_TOKEN: ${{ secrets.REPORT_RECEIVER_TOKEN }}
        run: |
          if [ -z "$REPORT_RECEIVER_URL" ]; then
            echo "Missing REPORT_RECEIVER_URL repository secret."
            exit 1
          fi
          AUTH_ARGS=()
          if [ -n "$REPORT_RECEIVER_TOKEN" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer $REPORT_RECEIVER_TOKEN")
          fi
          curl --fail --show-error --silent \
            -X POST "$REPORT_RECEIVER_URL/report" \
            -H "Content-Type: application/json" \
            "${AUTH_ARGS[@]}" \
            --data-binary @test-report.json

      - name: Fail workflow when tests fail
        if: always() && steps.pytest.outcome == 'failure'
        run: |
          echo "One or more automated tests failed."
          exit 1

  deploy-pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
