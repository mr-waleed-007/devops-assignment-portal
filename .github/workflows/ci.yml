name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Run tests. A failing test makes this job (the "test stage") fail.
  test:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.report.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run tests
        id: pytest
        continue-on-error: true          # so the report is still built on failure
        run: python -m pytest --junitxml=junit.xml -v

      - name: Build testreport.json
        id: report
        if: always()
        run: python scripts/build_report.py --junit junit.xml --out testreport.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testreport
          path: testreport.json

      - name: Fail the test stage if any test failed
        if: steps.pytest.outcome == 'failure'
        run: |
          echo "Tests failed"
          exit 1

  # 2) Deliver report to the local receiver (runs for passing AND failing runs)
  report:
    needs: test
    if: always() && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testreport
      - name: Send report to localhost receiver
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}
        run: python scripts/send_report.py testreport.json

  # BONUS: email report (skipped automatically if SMTP secrets are not set)
  email:
    needs: test
    if: always() && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        if: env.MAIL_USERNAME != ''
      - uses: actions/download-artifact@v4
        if: env.MAIL_USERNAME != ''
        with:
          name: testreport
      - name: Build email body
        if: env.MAIL_USERNAME != ''
        run: python scripts/email_body.py
      - name: Send email
        if: env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: DevOps CI <${{ secrets.MAIL_USERNAME }}>
          subject: "[${{ needs.test.outputs.status }}] ${{ github.repository }} @ ${{ github.sha }}"
          body: file://email_body.txt
          attachments: testreport.json

  # BONUS: deploy to GitHub Pages only on main and only if tests passed
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
